name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIQUE_HOME: ${{ runner.temp }}/clique-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: engine
        run: python3 tools/smoke.py
      - name: api surface
        run: python3 tools/api_drift.py
      - name: server
        run: |
          set -e
          mkdir -p "$CLIQUE_HOME"
          python3 -m clique password 'ci-smoke-password'
          python3 -m clique --host 127.0.0.1 --port 3200 &
          echo $! > "$RUNNER_TEMP/clique.pid"
          trap 'kill "$(cat "$RUNNER_TEMP/clique.pid")" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:3200/healthz && break
            sleep 0.2
          done
          python3 tools/smoke_http.py

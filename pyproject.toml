[project]
name = "clique"
version = "0.21.1"
description = "Your private clique of CLIs. Folder-organised, CLI-agnostic coding sessions in a browser, persisted in tmux"
requires-python = ">=3.11"
dependencies = []          # deliberate: stdlib only, so it still starts in two years

[project.scripts]
clique = "clique.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clique*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["E501"]          # long lines are almost always a comment explaining why

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]       # sys.path insert before imports, on purpose

name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: engine
        run: python3 tools/smoke.py
      - name: api surface
        run: python3 tools/api_drift.py
      - name: site copy
        run: python3 tools/site_i18n.py --check
      - name: server
        run: python3 tools/smoke_http.py
      - name: dead resume keys recover
        run: python3 tools/resume_check.py

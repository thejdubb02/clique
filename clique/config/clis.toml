# CLI type registry.
#
# Adding a coding CLI to CLIque is adding a block here. If a new CLI ever
# needs a Python change, this design has failed — say so rather than patching
# around it.
#
# Entries are cheap. CLIque checks whether each command actually exists on
# this box (PATH first, then the usual install directories) and the new-session
# picker offers only the ones that are really here. So this file is a catalogue
# of what CLIque *knows how to run*, not a claim about what is installed.
#
# Placeholders usable in `args` and `resume`:
#   {id}              clique's session id (full uuid)
#   {uuid}            alias for {id}
#   {name}            the session name the user typed
#   {cwd}             working directory
#   {mode}            current autonomy mode; only valid if `modes` is set
#   {cli_session_id}  the CLI's own session id; `resume` only
#
# Optional keys:
#   modes       list of autonomy/permission modes, in the order the CLI cycles
#               them. Presence of this key is what makes the mode pill appear;
#               omit it and the pill is hidden. There is no per-CLI branch in
#               the code.
#   mode_key    the key that cycles mode. Sent into the pane when the pill is
#               clicked, and watched for coming *out* of the keyboard so that
#               cycling by hand moves the pill too. "S-Tab", "Tab" and
#               "C-<letter>" can be recognised both ways; anything else can be
#               sent but not detected, and the pill will drift out of step.
#
#               The order in `modes` must match the order the CLI actually
#               cycles in. CLIque cannot read the CLI's real mode — that would
#               mean parsing its output — so it counts steps instead. Get the
#               order wrong and the pill will confidently name the wrong mode,
#               which is worse than having no pill.
#   mode_label  text shown in the pill, {mode} substituted
#   quick_commands  a list of strings, each sent into the pane as if typed and
#               Enter pressed, when its button is tapped — one row, one button
#               per entry. Presence of this key is what makes the row appear;
#               omit it and no row shows for that CLI. There is no per-CLI
#               branch in the code, same as `modes`.
#   resume      argv used instead of `args` when reattaching to a known
#               {cli_session_id}
#   own_input   true if this CLI draws its own input box at the bottom of the
#               pane. Purely about what is on screen: a boxed prompt sitting
#               directly above CLIque's prompt box is two input boxes stacked,
#               and the panel's is the redundant half, so it hides itself. A
#               CLI that prints `>` and waits — a shell, most readline tools —
#               is not doubled by anything, and there the panel's box is the
#               only place Run, the repeat counter and a saved draft live.
#
#               The mode pill never hides with it. It is the control for a
#               CLI's permission mode, and losing that was the bug in the
#               setting this replaces.
#
#               Only consulted when the `input_mode` setting is "auto", which
#               is the default; "panel" and "terminal" still decide outright.
#   status      { url = ".../api/v2/status.json", page = "https://..." } —
#               an Atlassian Statuspage feed for the service behind this CLI.
#               A CLI with no block is never asked about, and nothing is
#               invented for it. One format on purpose.
#   icon        filename in clique/web/icons/. Drawn as a mask and tinted, so
#               only the silhouette is used. Leave it out and the UI draws a
#               letter badge in the CLI's colour, which is a perfectly good
#               marker — do not add a bad icon just to fill the field.
#
# ---------------------------------------------------------------------------
# A NOTE ON FLAGS. The four CLIs at the top have had their flags checked
# against `--help` on this box. The rest launch bare, which is always safe for
# an interactive TUI but means no mode pill and no resume. If you use one of
# them seriously, check its `--help` and fill in `args`/`modes` — that is a
# five-line edit here, not a code change.
# ---------------------------------------------------------------------------

[cli.claude]
label      = "Claude Code"
command    = "claude"
args       = ["--permission-mode", "{mode}", "--session-id", "{id}", "--name", "{name}"]
resume     = ["--permission-mode", "{mode}", "--resume", "{cli_session_id}"]
color      = "#D97757"
icon       = "claude.svg"
modes      = ["auto", "default", "acceptEdits", "plan"]
mode_key   = "S-Tab"
mode_label = "{mode} mode on (shift+tab to cycle)"
quick_commands = ["/clear", "/compact", "/cost"]

# Extra regexes on top of the generic question marks every CLI already gets
# (y/n, Do you want, a numbered choice). Match one and the session's ring
# says "needs an answer" instead of spinning or sitting idle.
#
# Tune them to what you actually see. That is the whole design — CLIque never
# learns what a vendor's prompt looks like, you write it down here, and you
# can fix it the day it changes without waiting for a release.
#
# For something exact rather than guessed, skip patterns entirely and have the
# CLI tell CLIque directly:
#
#   curl -XPOST -H "Authorization: Bearer $CLIQUE_TOKEN" \
#        -d '{"state":"waiting"}' "$CLIQUE_URL/api/sessions/$ID/attention"
#
# from a Claude Code hook, a shell trap, or the last line of a script.
status  = { url = "https://status.claude.com/api/v2/status.json", page = "https://status.claude.com" }

own_input = true

# Claude Code speaks a hook protocol, so CLIque wires the curl above for you:
# sessions launched here run with a --settings block whose Notification / Stop /
# UserPromptSubmit hooks POST their real state to the attention endpoint. No
# guessing from output, and nothing for you to install. Set false to opt out and
# fall back to the patterns above.
hooks = true

[cli.claude.attention]
waiting = [
  "\\(y/n\\)",
  "\\[[Yy]/[Nn]\\]",
  "Do you want to",
  "Press Enter to continue",
  "❯ 1\\.",
]
error = [
  "^Error:",
  "command not found",
  "Traceback \\(most recent call last\\)",
]

# Where Claude Code keeps its transcripts. One directory per project, named
# after the working directory with every "/" and "." replaced by "-", and one
# .jsonl per conversation whose stem is the id `--resume` wants.
[cli.claude.history]
dir     = "~/.claude/projects"
layout  = "dashed-dir"
pattern = "*.jsonl"

# How much of the plan is spent, for the status bar. Read by `clique/usage.py`,
# which does exactly what this says and knows nothing else: take the token out
# of that file at that path, ask that URL, and pull those fields out of the
# reply. The token is spent on the request and never reaches the browser, and
# any failure is silence rather than an error.
#
# Delete this block and the bar simply stops showing it. Another CLI that
# publishes the same kind of endpoint is another block, not a code change.
[cli.claude.usage]
url         = "https://api.anthropic.com/api/oauth/usage"
token_file  = "~/.claude/.credentials.json"
token_field = "claudeAiOauth.accessToken"
headers     = { "anthropic-beta" = "oauth-2025-04-20" }

  [[cli.claude.usage.window]]
  label   = "5H"
  percent = "five_hour.utilization"
  resets  = "five_hour.resets_at"

  [[cli.claude.usage.window]]
  label   = "7D"
  percent = "seven_day.utilization"
  resets  = "seven_day.resets_at"

[cli.gemini]
label      = "Gemini CLI"
command    = "gemini"
args       = ["--approval-mode", "{mode}", "--session-id", "{id}"]
resume     = ["--approval-mode", "{mode}", "--resume", "{cli_session_id}"]
color      = "#1f6feb"
icon       = "gemini.svg"
modes      = ["yolo", "default", "auto_edit", "plan"]
mode_key   = "S-Tab"
mode_label = "{mode} mode"

own_input = true

[cli.grok]
label   = "Grok CLI"
command = "grok"
args    = ["--always-approve"]
resume  = ["--always-approve", "--resume", "{cli_session_id}"]
color   = "#E8E8E8"
icon    = "grok.svg"
# No `modes`: grok's approval is one boolean flag, not a cycle. The pill is
# hidden because the key is absent, not because anything knows what grok is.

own_input = true

# No `status` block: xAI's page (status.x.ai) is not Atlassian Statuspage —
# there is no `/api/v2/status.json`. A second parser just for Grok would be
# the first vendor scraper, and the day they change the HTML the banner
# would lie. When they publish the same two-field feed Claude uses, this
# is two lines.

# Grok keeps one append-only log per project rather than a transcript per
# conversation: the directory name is the working directory percent-encoded,
# and every line carries the session id, the prompt and when it was sent.
# Verified against a real install rather than taken from documentation.
[cli.grok.history]
dir    = "~/.grok/sessions"
layout = "prompt-log"
file   = "prompt_history.jsonl"

# Taken from what a real Grok CLI put on screen, not from documentation. Its
# confirmations end in an escape hint and its choices are a numbered list with
# a chevron on the selected row — the same shape Claude's `❯ 1.` catches.
[cli.grok.attention]
waiting = [
  "Esc to cancel",
  "Don.t ask me again",
  "\\(y/n\\)",
  "❯ ?[0-9]+\\.",
]
error = [
  "^Error:",
  "command not found",
  "Traceback \\(most recent call last\\)",
]

# xAI has no documented usage API (CLQ-68's 0.78.0 pass found the same for
# Gemini and Antigravity). What the real Grok CLI's own usage screen calls
# turned out to be reachable anyway: `auth.json` holds an OIDC access token
# under a key named after the issuer and client id, not a fixed field, hence
# `*` to take whatever that key is. That token reads the same weekly-credit
# endpoint the CLI's TUI does. Verified against a live account, 2026-09-22.
# Undocumented, so xAI can change or lock it without notice; failure here is
# silence (usage.py), same as any other probe.
[cli.grok.usage]
url         = "https://cli-chat-proxy.grok.com/v1/billing?format=credits"
token_file  = "~/.grok/auth.json"
token_field = "*.key"

  [[cli.grok.usage.window]]
  label   = "Wk"
  percent = "config.creditUsagePercent"
  resets  = "config.currentPeriod.end"

[cli.antigravity]
label   = "Antigravity"
command = "agy"
args    = []
# agy resumes a conversation by its own id, and there is no flag to hand it
# ours, so a fresh session starts a fresh conversation; --conversation is here
# for when an id has been captured. `agy --continue` is the "most recent" door.
resume  = ["--conversation", "{cli_session_id}"]
color   = "#7c6cf0"
icon    = "antigravity.svg"
# No `modes`: agy cycles its own execution mode inside the TUI (accept-edits,
# plan), like Grok's approval toggle. The pill stays hidden with the key absent.

own_input = true

# No plain REST endpoint: the real RPC (found by reading strings out of the
# agy binary, 2026-09-22) is a protobuf Connect-RPC call to
# google.internal.cloud.code.v1internal.PredictionService/RetrieveUserQuota
# on cloudcode-pa.googleapis.com, authenticated via the OS keyring rather
# than a token file — out of reach of the url+token_file probe above. `agy`
# already knows how to ask and print the answer, so `cmd` runs it instead of
# reimplementing an undocumented internal RPC. Verified against a live
# account, 2026-09-22; the reply reports what is *left* (`remaining_fraction`,
# 0..1) rather than what is spent, hence `remaining` instead of `percent`.
[cli.antigravity.usage]
cmd = ["agy", "-p", "/usage", "--output-format", "json"]

  [[cli.antigravity.usage.window]]
  label     = "GEM"
  remaining = "command.data.groups.name=Gemini Models.buckets.id=gemini-weekly.remaining_fraction"
  resets    = "command.data.groups.name=Gemini Models.buckets.id=gemini-weekly.reset_time"

  [[cli.antigravity.usage.window]]
  label     = "3RD"
  remaining = "command.data.groups.name=Claude and GPT models.buckets.id=3p-weekly.remaining_fraction"
  resets    = "command.data.groups.name=Claude and GPT models.buckets.id=3p-weekly.reset_time"

[cli.shell]
label   = "Shell"
command = "bash"
args    = ["-l"]
color   = "#8b8b8b"
icon    = "shell.svg"


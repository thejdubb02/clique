name: Bug
description: Something is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or the number in the sidebar. Include the short commit if you see one.
      placeholder: 0.21.1 (abc1234)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python, tmux, OS
      placeholder: "Python 3.12, tmux 3.4, Linux"
  - type: input
    id: browser
    attributes:
      label: Browser
      description: It is a browser app, and half of what breaks breaks in only one of them.
      placeholder: Firefox 141 / Safari on iOS 19
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Short steps. If it needs a particular CLI, say which one.
  - type: textarea
    id: logs
    attributes:
      label: Anything in the console or the journal?
      description: Browser devtools console, or `journalctl --user -u clique`.
      render: shell

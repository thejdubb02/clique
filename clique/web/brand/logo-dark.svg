<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CodemanPanel">
  <!-- sidebar: an accent block over two list rows -->
  <rect x="5"  y="13" width="14" height="14" rx="3.5" fill="#39afec"/>
  <rect x="5"  y="31" width="14" height="5.5" rx="2.75" fill="#39afec"/>
  <rect x="5"  y="40" width="14" height="5.5" rx="2.75" fill="#39afec"/>
  <!-- the divider between sidebar and panel -->
  <rect x="26" y="9"  width="6"  height="46" rx="3" fill="#8b949e"/>
  <!-- the panel, open toward the sidebar -->
  <rect x="38" y="9"  width="21" height="6" rx="3" fill="#8b949e"/>
  <rect x="53" y="9"  width="6"  height="46" rx="3" fill="#8b949e"/>
  <rect x="38" y="49" width="21" height="6" rx="3" fill="#8b949e"/>
</svg>
